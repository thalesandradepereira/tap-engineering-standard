services:
  studio:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TAP_STUDIO_DB_PATH: /data/studio.db
      TAP_STUDIO_ADMIN_USER: ${TAP_STUDIO_ADMIN_USER:?Set bootstrap username}
      TAP_STUDIO_ADMIN_PASSWORD: ${TAP_STUDIO_ADMIN_PASSWORD:?Use Docker secrets or a private .env, never commit it}
      TAP_STUDIO_MODEL_ENDPOINT: ${TAP_STUDIO_MODEL_ENDPOINT:-}
      TAP_STUDIO_MODEL_KEY: ${TAP_STUDIO_MODEL_KEY:-}
      TAP_STUDIO_MODEL_NAME: ${TAP_STUDIO_MODEL_NAME:-}
      TAP_STUDIO_ALLOWED_MODEL_HOSTS: ${TAP_STUDIO_ALLOWED_MODEL_HOSTS:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tap-studio-db:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
volumes:
  tap-studio-db:
