name: Validate TAP Engineering Standard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package and run regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Agent Skill and repository security invariants
        run: python3 scripts/validate_skill.py

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
